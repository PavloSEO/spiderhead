[package]
name = "spiderhead-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SpiderHead desktop window (egui) and its control-channel client"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spiderhead-desktop"
path = "src/main.rs"

[[bin]]
name = "spiderhead-desktop-ctl"
path = "src/bin/spiderhead-desktop-ctl.rs"

[dependencies]
encoding_rs.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
indexmap.workspace = true
flate2.workspace = true
sha2.workspace = true
uuid.workspace = true
rfd.workspace = true
spiderhead-control.workspace = true
spiderhead-core.workspace = true
spiderhead-sources.workspace = true
spiderhead-store.workspace = true
spiderhead-formats.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
