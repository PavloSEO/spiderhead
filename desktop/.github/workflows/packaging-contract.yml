name: Packaging contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package-contract:
    name: Packaging contract (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate portable packaging contracts
        run: python -m unittest discover -s tests -p test_packaging.py -v
