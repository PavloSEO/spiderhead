name: release

# Pushing to the `release` branch builds every target and (re)writes a DRAFT GitHub Release
# for the workspace version. Publishing the draft in the GitHub UI is what creates the tag
# `vX.Y.Z` at the built commit and makes the release visible to `spiderhead update-check`.
# A version that is already published can never be rebuilt: bump it with
# `cargo xtask version set` first.
#
# A manual run from any other branch builds and uploads the artifacts but publishes nothing.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # .cargo/config.toml points at sccache for local worktrees; runners use rust-cache instead.
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - name: Every spelling of the version agrees
        run: cargo xtask version check
      - name: Version is not published yet
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo xtask version show)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; bump the version with 'cargo xtask version set'"; exit 1
          fi
          if published=$(gh release view "$tag" --json isDraft --jq '.isDraft == false' 2>/dev/null) && [ "$published" = true ]; then
            echo "::error::$tag is already published; bump the version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install the target for the pinned toolchain
        # rust-toolchain.toml pins the compiler, so the target must be added to that one.
        run: rustup target add "$TARGET"
      - name: Build the CLI
        run: cargo build --release --locked --target "$TARGET" -p spiderhead-cli
      - name: Stage the binary
        run: |
          mkdir out
          cp "target/$TARGET/release/spiderhead" "out/spiderhead-$VERSION-$TARGET"
          # A binary that cannot run here (the x86_64 mac build on an arm runner runs under
          # Rosetta) must still report the released version before it is attached.
          "out/spiderhead-$VERSION-$TARGET" --version | grep -F "$VERSION"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev libssl-dev pkg-config
      - name: Build the installers (macOS .dmg/.pkg)
        if: runner.os == 'macOS'
        run: |
          cargo xtask dist --target "$TARGET"
          cargo xtask package macos --target "$TARGET"
          cp target/dist/"$VERSION"/installers/* out/
      - name: Build the installers (Linux .tar.gz/.deb/.AppImage)
        if: runner.os == 'Linux'
        env:
          # appimagetool 1.9.1, pinned by the digest GitHub publishes for the release asset.
          APPIMAGETOOL_X86_64: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGETOOL_AARCH64: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
        run: |
          arch=$(uname -m)
          sum=$(eval echo "\$APPIMAGETOOL_$(echo "$arch" | tr a-z A-Z)")
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage"
          echo "$sum  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          export APPIMAGETOOL="$RUNNER_TEMP/appimagetool"
          cargo xtask dist --target "$TARGET"
          cargo xtask package linux --target "$TARGET"
          cp target/dist/"$VERSION"/installers/* out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spiderhead-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  draft:
    name: draft release
    # Only the `release` branch writes a draft; other runs stop after the build.
    if: github.ref == 'refs/heads/release'
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          sha256sum -- spiderhead-* > SHA256SUMS
          cat SHA256SUMS
      - name: Write the draft
        run: |
          if draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "::error::$TAG is already published; bump the version"; exit 1; }
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "SpiderHead $TAG" --generate-notes out/*
          fi
