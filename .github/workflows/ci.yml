name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,mcp,cluster,reports,remote]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Type-check the covered surface (issue #31)
        run: |
          # Explicit file list, not `mypy seohead`: passing the package would check
          # every file as a source target (follow_imports=silent only silences
          # imports OUTSIDE these targets) and pull in modules not annotated yet.
          # Extend this list only as a module is brought fully under the checker.
          mypy seohead/core/models.py seohead/checks/parser.py seohead/checks/robots.py
      - name: Run the full suite in four file groups with combined coverage
        run: python scripts/run_pytest_groups.py --out-dir "$RUNNER_TEMP/pytest-groups"

  windows:
    name: Windows native workflows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,mcp,reports]"
      - name: Verify OS locks, Unicode paths, native retry, and real stdio MCP
        run: python -m pytest -q tests/test_platform_filesystem.py tests/test_platform_workflows.py tests/test_registration.py tests/test_interface_binding.py tests/test_scan_history_cli.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # dev brings pytest, which the boundary check below now runs.
      - run: python -m pip install -e ".[dev,mcp,cluster,reports]"
      - name: Enforce core/interface boundary
        run: |
          # The rule itself lives in tests/test_interface_binding.py, which
          # discovers the core directories from the filesystem instead of
          # naming them. This line used to carry a hand-written list of five
          # of the package's eight directories, and the one it omitted was the
          # only one that violated the rule (#221). Running the test here keeps
          # one definition rather than two that drift.
          pytest tests/test_interface_binding.py -q
      - name: Enforce collector/analyzer boundary
        run: |
          # The collector gathers evidence; the analyzer judges it. They meet
          # only at the exports contract, so neither may import the other.
          if grep -rnE "^\s*from seohead\.sf|^\s*import seohead\.sf" seohead/crawl; then
            echo "::error::seohead/crawl must not import the analyzer"
            exit 1
          fi
          if grep -rnE "^\s*from seohead\.crawl|^\s*import seohead\.crawl" seohead/sf; then
            echo "::error::seohead/sf must not import the collector"
            exit 1
          fi
      - name: Run the synthetic crawl audit
        run: |
          seohead sf run --exports-dir docs/examples/exports --out /tmp/report --tasks
          python - <<'PY'
          import json
          from pathlib import Path
          from seohead.sf.core.registry import CHECKS

          data = json.loads(Path("/tmp/report/audit.json").read_text())
          fired = {issue["check"] for issue in data["issues"]}
          assert {"BROKEN_INTERNAL_LINK", "BROKEN_PAGE_4XX", "TITLE_MISSING"} <= fired
          coverage = data["summary"]["check_coverage"]
          skipped = {entry["id"] for entry in data["run"]["checks_skipped"]}
          silent = set(coverage["checks_silent_ids"])
          disabled = set(coverage["checks_disabled_ids"])
          assert coverage["checks_total"] == len(CHECKS)
          assert fired | skipped | silent | disabled == set(CHECKS)
          assert all(entry["reason"] for entry in data["run"]["checks_skipped"])
          print("issues", len(data["issues"]), "health", data["summary"]["health_score"])
          PY
      - name: Verify CLI and MCP registration
        run: |
          seohead --version
          sf-analyzer --version
          python - <<'PY'
          import asyncio
          from seohead.cli import COMMANDS
          from seohead.mcp.handlers import HANDLERS
          from seohead.mcp.mcp_server import build_server

          tools = asyncio.run(build_server().list_tools())
          names = {tool.name for tool in tools}
          expected = {f"seo_{name}" for name in HANDLERS}
          assert len(COMMANDS) == len(HANDLERS)
          assert expected <= names, sorted(expected - names)
          assert {"seo_parse", "seo_site_audit", "sf_audit_run"} <= names
          print("registered MCP tools", len(names))
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  review-pack:
    name: Software-review evidence pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      # Every supported extra installs so each documented dependency profile
      # resolves in this environment rather than being recorded as unresolved.
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m build
      - name: Generate and verify the pack for a disposable tag
        env:
          # Planted sentinels: nothing in the pack or the diagnostics may carry
          # these values. verify() scans the files; the greps scan the log output.
          SEOHEAD_REVIEW_CANARY_CREDENTIAL: canary-credential-7f3c2a1e
          SEOHEAD_REVIEW_CANARY_CLIENT: https://canary-client.example.invalid
        run: |
          TAG="v$(python -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          python scripts/generate_review_pack.py generate --dist dist --tag "$TAG" --out review-pack | tee /tmp/review-generate.log
          python scripts/generate_review_pack.py verify --pack review-pack | tee /tmp/review-verify.log
          ! grep -R "$SEOHEAD_REVIEW_CANARY_CREDENTIAL" review-pack /tmp/review-generate.log /tmp/review-verify.log
          ! grep -R "$SEOHEAD_REVIEW_CANARY_CLIENT" review-pack /tmp/review-generate.log /tmp/review-verify.log
      - uses: actions/upload-artifact@v7
        with:
          name: software-review-pack
          path: review-pack/

  linux-lifecycle:
    name: Linux SSH install, upgrade, and rollback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
          enable-cache: false
      - name: Choose the previous revision
        id: base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$EVENT_BASE" ] && [ "$EVENT_BASE" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=$EVENT_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked revisions, render localhost fixture, upgrade, and roll back
        run: |
          chrome_path="$(command -v google-chrome || true)"
          if [ -z "$chrome_path" ]; then
            echo "Google Chrome is required for the Ubuntu AppArmor-safe render smoke" >&2
            exit 1
          fi
          chrome_path="$(readlink -f "$chrome_path")"
          test -x "$chrome_path"
          echo "Using sandboxed local Chrome at $chrome_path"
          export SEOHEAD_CHROME="$chrome_path"
          python scripts/linux_lifecycle_smoke.py \
            --base-ref "${{ steps.base.outputs.sha }}" \
            --metrics-out "$RUNNER_TEMP/linux-lifecycle-metrics.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-lifecycle-metrics
          path: ${{ runner.temp }}/linux-lifecycle-metrics.json
          if-no-files-found: ignore
          retention-days: 14


  pdf-validation:
    name: PDF structure and extraction
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,reports,pdf]"
      - run: google-chrome --version
      - run: pytest tests/test_pdf_validation.py -q


  disposable-service-profile:
    name: Disposable TLS proxy, recovery, and rollback profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exercise owned loopback TLS and recovery fixture
        run: >
          python scripts/disposable_service_profile.py
          --metrics-out "$RUNNER_TEMP/disposable-service-profile.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: disposable-service-profile
          path: ${{ runner.temp }}/disposable-service-profile.json
          if-no-files-found: ignore
          retention-days: 14

  disposable-worker-recovery:
    name: Disposable SSH worker and bounded storage recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the isolated worker fixture dependencies
        run: python -m pip install -e ".[dev,remote,reports,render]"
      - name: Prepare the OpenSSH privilege-separation directory
        run: sudo install -d -o root -g root -m 0755 /run/sshd
      - name: Exercise SSH dispatch and a real bounded ENOSPC recovery
        run: |
          chrome_path="$(command -v google-chrome || true)"
          if [ -z "$chrome_path" ]; then
            echo "Google Chrome is required for the rendered recovery job" >&2
            exit 1
          fi
          export SEOHEAD_CHROME="$(readlink -f "$chrome_path")"
          python scripts/disposable_worker_recovery.py \
            --metrics-out "$RUNNER_TEMP/disposable-worker-recovery.json" \
            --evidence-out "$RUNNER_TEMP/disposable-worker-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: disposable-worker-recovery
          path: |
            ${{ runner.temp }}/disposable-worker-recovery.json
            ${{ runner.temp }}/disposable-worker-evidence/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: seohead-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size and smoke-test the slim image
        run: |
          # Printed on every run so a transitive dependency that quietly adds
          # 200 MB is visible in the build log, not discovered months later.
          docker images seohead-tools:ci --format 'slim image size: {{.Size}}'
          docker run --rm seohead-tools:ci --version
          docker run --rm -v "$PWD/docs/examples:/data/examples:ro" seohead-tools:ci \
            sf run --exports-dir /data/examples/exports --out /tmp/report -q
          docker run --rm --entrypoint python seohead-tools:ci -c "
          import asyncio
          from seohead.mcp.handlers import HANDLERS
          from seohead.mcp.mcp_server import build_server
          tools = asyncio.run(build_server().list_tools())
          names = {tool.name for tool in tools}
          expected = {f'seo_{name}' for name in HANDLERS}
          assert expected <= names, sorted(expected - names)
          assert {'seo_parse', 'seo_site_audit', 'sf_audit_run'} <= names
          print(f'MCP tools available in the slim image: {len(tools)}')
          "
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: seohead-tools:ci-full
          build-args: EXTRAS=all
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size and smoke-test the full image
        run: |
          # The full image is the documented alternate build target (EXTRAS=all):
          # it must build and actually carry clustering, not just be smaller than
          # nothing to compare against.
          docker images seohead-tools:ci-full --format 'full image size: {{.Size}}'
          docker run --rm seohead-tools:ci-full --version
          docker run --rm --entrypoint python seohead-tools:ci-full -c "
          import sklearn
          from seohead.checks.clusterer import _SKLEARN_OK
          assert _SKLEARN_OK, 'clustering extra did not install correctly'
          print(f'scikit-learn available in the full image: {sklearn.__version__}')
          "
